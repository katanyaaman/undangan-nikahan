<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Pola bintang segi delapan emas">
  <rect width="600" height="600" fill="#0B3D33"/>
  <g fill="none" stroke="#C9A227" stroke-width="3" opacity="0.85">
    <g id="star">
      <rect x="-46" y="-46" width="92" height="92"/>
      <rect x="-46" y="-46" width="92" height="92" transform="rotate(45)"/>
      <circle r="14"/>
    </g>
    <use href="#star" x="110" y="110"/>
    <use href="#star" x="300" y="110"/>
    <use href="#star" x="490" y="110"/>
    <use href="#star" x="110" y="300"/>
    <use href="#star" x="300" y="300"/>
    <use href="#star" x="490" y="300"/>
    <use href="#star" x="110" y="490"/>
    <use href="#star" x="300" y="490"/>
    <use href="#star" x="490" y="490"/>
  </g>
  <g stroke="#C9A227" stroke-width="2" opacity="0.4">
    <line x1="0" y1="205" x2="600" y2="205"/>
    <line x1="0" y1="395" x2="600" y2="395"/>
    <line x1="205" y1="0" x2="205" y2="600"/>
    <line x1="395" y1="0" x2="395" y2="600"/>
  </g>
  <g transform="translate(300 300)" fill="none" stroke="#E3C98F" stroke-width="4">
    <rect x="-72" y="-72" width="144" height="144"/>
    <rect x="-72" y="-72" width="144" height="144" transform="rotate(45)"/>
    <circle r="20" fill="#C9A227" opacity="0.9" stroke="none"/>
  </g>
</svg>
